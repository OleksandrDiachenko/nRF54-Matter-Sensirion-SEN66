CONFIG_HW_STACK_PROTECTION=n
CONFIG_BOOT_WATCHDOG_FEED=n

# nRF54LM20-DK uses SPI NOR external flash for the MCUboot secondary slot.
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_DEVICETREE=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# Keep the system counter reset behavior stable after software reset.
CONFIG_TICKLESS_KERNEL=y
