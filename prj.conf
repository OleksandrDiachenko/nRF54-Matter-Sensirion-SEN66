CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="SEN66 Air Quality Sensor"
CONFIG_CHIP_DEVICE_PRODUCT_ID=32768
CONFIG_STD_CPP17=y

CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/air_quality_sensor.zap"

# Allow a commissioner to rendezvous over Bluetooth LE and provide Wi-Fi credentials.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60
CONFIG_BT_DEVICE_NAME="SEN66 Sensor"

# Removing the last fabric (e.g. `chip-tool pairing unpair`) must not also
# wipe the Wi-Fi station credentials: re-commissioning to a new controller
# during Apple Home bring-up (M5) should not require re-entering the Wi-Fi
# password every time. With NONE, unpairing only clears the fabric table; a
# reboot then reopens the BLE commissioning window (pairing autostart checks
# FabricCount() == 0 independently of Wi-Fi state) while Wi-Fi stays
# connected. See docs/apple-home.md for the full procedure and why a Button 1
# press does not do this once Wi-Fi is already connected.
CONFIG_CHIP_LAST_FABRIC_REMOVED_NONE=y

# Publish the Matter onboarding payload through the DK NFC tag interface.
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=y

# SEN66 air-quality sensor over I2C (feature/sen66-driver).
CONFIG_I2C=y

# Nordic DK button and LED support plus diagnostics during development.
CONFIG_DK_LIBRARY=y
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_CHIP_LIB_SHELL=y
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_AUTOSTART=y
CONFIG_CHIP_FACTORY_DATA=y
CONFIG_CHIP_FACTORY_DATA_BUILD=y
CONFIG_CHIP_FACTORY_RESET_ERASE_SETTINGS=y
# Keep the development DAC key in factory data. Migrating it to the nRF54 KMU
# makes a key from an earlier development flash persist across later builds.
CONFIG_CHIP_CRYPTO_PSA_MIGRATE_DAC_PRIV_KEY=n
CONFIG_USE_SEGGER_RTT=n
