name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NCS_VERSION: v3.4.0
  NCS_DIR: /root/ncs

jobs:
  unit-tests:
    name: Unit tests (twister)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.0
      env:
        ACCEPT_JLINK_LICENSE: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: Trust checked-out and cached directories
        run: git config --global --add safe.directory '*'

      - name: Cache NCS west workspace
        id: ncs-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NCS_DIR }}
          key: ncs-workspace-${{ env.NCS_VERSION }}-v1

      - name: Fetch NCS ${{ env.NCS_VERSION }} workspace
        if: steps.ncs-cache.outputs.cache-hit != 'true'
        run: |
          west init -m https://github.com/nrfconnect/sdk-nrf --mr "$NCS_VERSION" "$NCS_DIR"
          cd "$NCS_DIR"
          west update --narrow -o=--depth=1

      - name: Install host C++ compiler
        run: |
          # The image ships a pending jlink package whose postinst calls
          # `udevadm control --reload-rules`, which fails in a container
          # with no running udev and aborts dpkg's --configure pass that
          # any apt-get install triggers. Mask udevadm so it's a no-op.
          ln -sf /bin/true /usr/bin/udevadm
          apt-get update
          apt-get install -y --no-install-recommends g++

      - name: Run unit tests
        run: |
          source "$NCS_DIR/zephyr/zephyr-env.sh"
          cd app
          west twister -T tests -p unit_testing --inline-logs -v

      - name: Upload twister artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-out
          path: app/twister-out
          retention-days: 7
          if-no-files-found: ignore

  firmware-build:
    name: Firmware build (nrf54lm20dk, Matter over Wi-Fi)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.0
      env:
        ACCEPT_JLINK_LICENSE: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: Trust checked-out and cached directories
        run: git config --global --add safe.directory '*'

      - name: Cache NCS west workspace
        id: ncs-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NCS_DIR }}
          key: ncs-workspace-${{ env.NCS_VERSION }}-v1

      - name: Fetch NCS ${{ env.NCS_VERSION }} workspace
        if: steps.ncs-cache.outputs.cache-hit != 'true'
        run: |
          west init -m https://github.com/nrfconnect/sdk-nrf --mr "$NCS_VERSION" "$NCS_DIR"
          cd "$NCS_DIR"
          west update --narrow -o=--depth=1

      - name: Build firmware
        run: |
          source "$NCS_DIR/zephyr/zephyr-env.sh"
          cd app
          west build -p -b nrf54lm20dk/nrf54lm20a/cpuapp --sysbuild -- \
            -DSHIELD=nrf7002eb2 \
            -DSB_CONFIG_WIFI_NRF70=y \
            -DCONFIG_CHIP_WIFI=y
